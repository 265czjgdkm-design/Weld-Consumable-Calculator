name: Nightly Health Check

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  nightly-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze lib test

      - name: Widget tests
        run: flutter test test/widget_test.dart -r compact

      - name: Report tests
        run: flutter test test/report_preview_test.dart -r compact

      - name: Build web
        run: flutter build web
